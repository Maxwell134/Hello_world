name: Testing

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - prod
      user_options:
        description: 'User options'
        required: false
        default: 'keyvault'
        type: choice
        options:
          - keyvault
          - cluster_upgrade

permissions:
  id-token: write
  contents: read

jobs:
  code-quality:
    uses: ./.github/workflows/code-quality.yml
    with:
      environment: ${{ github.event.inputs.environment }}
      user_options: ${{ github.event.inputs.user_options }}

  build:
    needs: code-quality
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    if : ${{ github.event.inputs.user_options == 'keyvault'  && startsWith(github.ref, 'refs/heads/main') }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12
    
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
      - name: Upload secrets to Key Vault
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          az keyvault secret set \
            --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" \
            --name "db-username" \
            --value "$DB_USERNAME"

          az keyvault secret set \
            --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" \
            --name "db-password" \
            --value "$DB_PASSWORD"

          az keyvault secret set \
            --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" \
            --name "api-key" \
            --value "$API_KEY"
        shell: bash