name: Testing

on: 
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - prod
      user_options:
        description: 'User options'
        required: false
        default: 'keyvault'
        type: choice
        options:
          - keyvault
          - cluster_upgrade

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    if : ${{ github.event.inputs.user_options == 'keyvault'  && startsWith(github.ref, 'refs/heads/main') }}
    
    steps:
      - uses: actions/checkout@v4
    
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
      - name: Upload secrets to Key Vault
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          for secret in DB_USERNAME DB_PASSWORD API_KEY
          do
            az keyvault secret set \
              --vault-name "${{ secrets.AZURE_KEYVAULT_NAME }}" \
              --name "$secret" \
              --value "${!secret}"
          done
        shell: bash
